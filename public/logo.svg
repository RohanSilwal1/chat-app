<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"></stop>
      <stop offset="100%" stop-color="#00D4FF"></stop>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2A2A72" flood-opacity="0.22"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="220" fill="url(#grad)" filter="url(#shadow)"></circle>

  <!-- Chat Bubble -->
  <path d="
      M155 150
      C155 115 183 90 220 90
      H292
      C348 90 390 132 390 188
      V245
      C390 301 348 343 292 343
      H235
      L165 390
      L180 332
      C165 317 155 295 155 270
      Z" fill="white"></path>

  <!-- Letter C -->
  <path d="
      M318 162
      A72 72 0 1 0 318 270" fill="none" stroke="url(#grad)" stroke-width="22" stroke-linecap="round"></path>

  <!-- Spark -->
  <path d="
      M310 145
      L330 180
      L367 188
      L337 210
      L345 245
      L310 225
      L275 245
      L283 210
      L253 188
      L290 180
      Z" fill="#FFD54F"></path>

  <!-- Message Lines -->
  <rect x="210" y="288" width="95" height="12" rx="6" fill="#E9ECF8"></rect>

  <rect x="210" y="313" width="65" height="12" rx="6" fill="#E9ECF8"></rect>
</svg>